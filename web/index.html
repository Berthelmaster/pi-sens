<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pisens</title>
    <script>
      // Apply a saved theme choice before first paint. See src/lib/theme.svelte.ts.
      try {
        const t = localStorage.getItem('pisens-theme')
        if (t === 'light' || t === 'dark')
          document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
